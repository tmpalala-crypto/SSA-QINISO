<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QINISO - ScanSafeAfrica PRO v3.2.1 FINAL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
:root{--navy:#0f172a;--blue:#1d4ed8;--green:#16a34a;--red:#dc2626;--orange:#ea580c;--yellow:#facc15}
body{background:#f1f5f9;padding-bottom:70px}
.topbar{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.shield{width:44px;height:44px;background:linear-gradient(180deg,#2563eb,#0f172a);border:2px solid var(--yellow);border-radius:10px;display:flex;align-items:center;justify-content:center}
.lawbanner{background:linear-gradient(90deg,#facc15,#f59e0b);color:#000;padding:10px 12px;font-weight:900;font-size:13px;text-align:center}
.lawbanner span{font-weight:400;font-size:11px;display:block}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin:12px;padding:14px;border:1px solid #e2e8f0}
.badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
.gps{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd}
.comp{background:#dcfce7;color:#166534;border:1px solid #86efac}
.flag{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.btn{border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-orange{background:var(--orange);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qrbox{border:2px solid #e2e8f0;border-radius:12px;padding:8px;text-align:center;background:#fff;position:relative}
.qrbox .mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:2px;border-radius:4px;font-size:16px;border:1px solid #0f172a}
.evi{border:2px solid #e2e8f0;border-radius:12px;padding:10px;text-align:center;position:relative}
.evi.cap{border-color:var(--green);background:#f0fdf4}.evi.del{border-color:var(--red);background:#fef2f2}
.stamp{position:absolute;top:35%;left:5%;right:5%;border:3px solid var(--red);color:var(--red);font-weight:900;transform:rotate(-15deg);text-align:center;padding:3px;font-size:11px;background:rgba(255,255,255,.9)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:6px 0;z-index:50}
.tab{flex:1;text-align:center;padding:6px;font-size:10px;color:#64748b;cursor:pointer}.tab.active{color:var(--blue);font-weight:900}.tab .ic{font-size:20px;display:block}
.hidden{display:none}
.dept{border-left:5px solid var(--blue);padding:12px;background:#fff;margin:8px 0;border-radius:0 12px 12px 0;display:flex;justify-content:space-between;align-items:center}
.dept.flagb{border-left-color:var(--red);background:#fef2f2}.dept.pend{border-left-color:var(--orange);background:#fff7ed}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 0}
#map{height:300px;border-radius:12px}
.biom{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#0f172a;color:#fff;padding:12px;border-radius:12px}
.fp{border:1px dashed #334155;border-radius:8px;padding:10px;text-align:center}
</style></head>
